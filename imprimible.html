<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imprimible Pre-Reserva - Vuelta al Mundo Tours</title>
    <link rel="icon" href="assets/logo/logo-circular-blanco.png">
    <link rel="stylesheet" href="css/fonts.css?v=20261026a">
    <link rel="stylesheet" href="css/print-corporativo.css?v=20261026a">
    <style>
        body { margin: 0; background: #1a4999; font-family: "Goldplay", sans-serif; }
        .controls-bar { background: rgba(10,10,10,0.92); color: #fff; padding: 14px 28px; display: flex; justify-content: space-between; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 10; }
        .controls-bar img { height: 30px; vertical-align: middle; }
        .controls-bar button { border: none; border-radius: 10px; padding: 11px 20px; font-weight: 700; font-size: 14px; cursor: pointer; font-family: inherit; }
        .btn-primary { background: #FF7F00; color: #fff; }
        .btn-secondary { background: rgba(255,255,255,0.15); color: #fff; border: 1px solid rgba(255,255,255,0.25) !important; }
        #data-status { font-size: 13px; font-weight: 600; }
        .print-document { padding: 30px 0 60px; display: flex; flex-direction: column; align-items: center; gap: 28px; }
        @media print { body { background: #fff; } .print-document { padding: 0; gap: 0; display: block; } }
    </style>
</head>
<body>
    <div class="no-print controls-bar">
        <div>
            <img src="assets/logo/logo-linea-blanco.png" alt="Vuelta al Mundo Tours">
            <button id="back-btn" onclick="window.location.href='prereserva.html'" class="btn-secondary" style="margin-left:14px">← Volver a Pre-Reserva</button>
        </div>
        <div>
            <span id="data-status">Cargando datos...</span>
            <button onclick="window.print()" class="btn-primary" style="margin-left:14px">🖨️ Imprimir / Guardar PDF</button>
        </div>
    </div>

    <div class="print-document" id="print-document"></div>

    <script src="js/config.js?v=20261026a"></script>
    <script src="js/api.js?v=20261026a"></script>
    <script src="js/legal.js?v=20261026a"></script>
    <script src="js/imprimible.js?v=20261026a"></script>
</body>
</html>
